<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Take Studio</title>
<link rel="stylesheet" href="/app/style.css">
</head>
<body>
<header id="top">
  <div class="brand"><button id="homeBtn" class="ghost" hidden onclick="goHome()" title="Back to all your reels">← All reels</button><span class="logo">✂</span><div><b>One Take Studio</b><small id="ptitle"></small></div></div>
  <nav id="tabs">
    <button data-tab="cut">✂ Cut</button>
    <button data-tab="visuals">✦ Visuals</button>
    <button data-tab="sound">♪ Sound</button>
    <button data-tab="finish">✓ Finish</button>
  </nav>
  <div class="tools">
    <button id="undo" title="Undo (⌘Z)">↶</button>
    <button id="redo" title="Redo (⇧⌘Z)">↷</button>
    <button id="claudeBtn" title="Ask Claude to change something">✳ Ask Claude <span id="claudeBadge" class="badge" hidden>0</span></button>
    <button id="helpBtn" title="Show me around">?</button>
    <button id="themeBtn" title="Light / dark">◐</button>
  </div>
</header>

<div id="claudeTray" class="tray" hidden></div>

<main id="main">
  <section id="panel"></section>
  <aside id="previewCol">
    <div id="phone">
      <div id="stageWrap">
        <div id="stage">
          <video id="v" playsinline preload="auto"></video>
          <video id="bv" playsinline muted preload="auto"></video>
          <img id="bimg" alt="">
          <div id="bpanel"></div>
          <canvas id="fc" width="1080" height="1920"></canvas>
          <div id="dim"></div>
          <div id="ovl"></div>
          <div id="cap"></div>
        </div>
      </div>
      <span class="pv">Preview</span>
    </div>
    <div class="pcontrols">
      <span id="ptime">0:00 / 0:00</span>
      <button id="back5" title="Back 3s">⟲</button>
      <button id="play" class="round" title="Play (space)">▶</button>
      <button id="fwd5" title="Forward 3s">⟳</button>
    </div>
    <audio id="music" loop preload="auto"></audio>
  </aside>
</main>

<footer id="bottom">
  <button id="play2" class="round" title="Play (space)">▶</button>
  <div class="clock"><b id="clock">0:00</b><small id="clockOf">of 0:00</small></div>
  <div class="tlwrap">
    <div class="tltools">
      <button data-op="split" class="big" title="Split the clip at the playhead (B)"><b>✂</b>Split</button>
      <button data-op="delete" class="big" title="Delete the selected clip (Delete)"><b>🗑</b>Delete</button>
      <button data-op="cutBefore" class="big" title="Cut this clip before the playhead (Q)"><b>⇤</b>Cut before</button>
      <button data-op="cutAfter" class="big" title="Cut this clip after the playhead (W)"><b>⇥</b>Cut after</button>
      <span class="spacer"></span>
      <button data-op="zoomOut" title="Zoom out">−</button>
      <input id="zoom" type="range" min="0" max="5.6" step="0.1" value="2.9">
      <button data-op="zoomIn" title="Zoom in">+</button>
    </div>
    <div class="tlframe"><div id="tlScroll"><div id="tlSpacer"></div><canvas id="tl" height="112"></canvas>
      <div id="tlTrack"><button id="tlMute"><b>🔊</b><span>Mute clip audio</span></button><button id="tlCover"><b>🖼</b><span>Cover</span></button></div>
    </div><div id="tlHead"></div></div>
    <div class="tlhint">Slide the strip to move · tap a clip to select it · drag its white handles to trim</div>
  </div>
  <button id="nextBtn" class="primary">Next: Visuals ›</button>
</footer>

<div id="modal" class="modal" hidden><div class="mbox"><button class="mclose" title="Close">×</button><div id="mbody"></div></div></div>
<div id="toasts"></div>

<script src="/app/timeline.js"></script>
<script src="/app/app.js"></script>
</body>
</html>
