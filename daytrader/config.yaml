# ---- Day-trading agent config (Ross Cameron momentum style) ----
# Strategy notes behind these numbers: strategy/ross_cameron_playbook.md

# paper = simulated money with real market prices. live = real orders.
mode: paper

# stocks = Ross's actual market (small-cap US stocks via Alpaca)
# crypto = the same rules adapted to coins (via a ccxt exchange)
market: stocks

# ---- stocks (Alpaca) ----
# Paper mode uses your Alpaca PAPER account; live uses your real Alpaca account.
stocks_data_feed: iex         # iex = free data; sip = full market data (paid Alpaca plan, better volume)
iex_volume_share: 0.03        # free IEX data sees ~3% of real volume; used to estimate the real total

# ---- crypto (ccxt) ----
exchange: coinbase
quote_currency: USD
paper_starting_cash: 10000    # crypto paper account only (Alpaca paper has its own balance)
paper_fee_rate: 0.006
paper_slippage: 0.0005

# Leave empty to trade whatever the scanner finds (Ross's way).
# Or list symbols to restrict trading to only those.
symbols: []

# ---- Scanner: the 5 pillars ----
scanner:
  price_min: 1                # pillar 1: price $1-$20 (sweet spot $5-$10)
  price_max: 20
  min_gain_pct: 10            # pillar 2: up at least 10% on the day
  min_rvol: 5                 # pillar 3: 5x relative volume
  require_news: false         # pillar 4: catalyst preferred; no-news movers get half size
  no_news_size_factor: 0.5
  thin_volume_shares: 500000  # thinner than this = reduced size
  thin_volume_size_factor: 0.5
  max_pct_of_day_volume: 0.02 # never own more than 2% of the day's volume
  news_max_age_hours: 24
  max_float: 20000000         # pillar 5: float under 20M shares (needs FMP_API_KEY); 10M when cold
  require_float_known: false  # true = skip stocks whose float can't be looked up
  crypto_min_rvol: 3
  crypto_min_quote_volume: 1000000
  max_candidates: 10

# ---- Timing ----
decision_interval_minutes: 5  # Claude scans + reviews every 5 min inside the trade window
watch_interval_seconds: 15    # code checks watchlist charts for a pullback trigger this often
monitor_interval_seconds: 5   # code checks stops / targets this often
setup_timeframe: 1m           # chart used for pullback entries

# ---- Hard risk limits: enforced in code, Claude cannot override ----
risk:
  trade_window: "07:00-11:00" # Ross's morning window, US Eastern. null = trade any time
  trade_window_tz: America/New_York
  max_position_pct: 0.25
  max_total_exposure_pct: 0.50
  risk_per_trade_pct: 0.01      # lose at most 1% of equity if a stop hits
  max_daily_loss_pct: 0.02      # stop for the day at -2%
  max_trades_per_day: 6
  max_consecutive_losses: 3     # 3 losers in a row = done for the day
  giveback_pct_of_peak: 0.5     # done for the day after giving back half the day's peak profit
  giveback_min_peak_pct: 0.005
  starter_size_fraction: 0.25   # 1/4 size until the day is green by the cushion
  cushion_per_share: 0.20       # stocks: 1/4 size until up 20c/share on that starter size (Ross)
  cushion_pct: 0.005            # crypto only
  scale_out_fraction: 0.5       # sell half at the target, stop to break-even on the rest
  move_stop_to_breakeven: true
  breakout_or_bailout_minutes: 1.5  # Ross: should move up ~10 cents within a minute, or get out
  bailout_min_move: 0.10        # $ per share
  exit_on_new_low_candle: true  # Ross: "the exit indicator is the first candle that makes a new low"
  min_order_usd: 50
  require_stop_loss: true
  max_stop_distance_pct: 0.10
  flatten_at_utc: null          # stocks: positions are also flattened at the end of the trade window

# ---- Claude ----
model: claude-opus-5-5
effort: high                  # for scheduled scan/review cycles
alert_effort: medium          # when woken by a live setup (faster answer)
max_tool_rounds: 14

# Your own extra instructions for Claude
strategy_notes: |
  Follow the Ross Cameron playbook strictly. Quality of the stock first, chart second.
  Only A+ setups. Doing nothing is a valid decision.
